<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brodia practice</title>
<!--
P05: Brodia scenario + receptivity selector. Static, no build step, no external assets.
Open locally:  python3 -m http.server 8000   (from the repo root)  ->  http://localhost:8000/web/
Optional preselection: ?scenario=park&receptivity=neutral
Selection contract (shared with the worker):
  {"scenario": "barista"|"street"|"park", "receptivity": "interested"|"neutral"|"uninterested"}
Nothing is stored and nothing is sent anywhere yet; see startPractice() for the P06/P07 hook.
-->
<style>
  :root {
    --bg:#f6f7f9; --fg:#141518; --mut:#5d6470; --card:#ffffff; --line:#d5dae1;
    --accent:#2457d6; --accent-bg:#e8eefc; --accent-fg:#ffffff; --warn:#8a5a00; --warn-bg:#fff4dc;
    --bad:#b3261e; --focus:#2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#111317; --fg:#eceef2; --mut:#9aa3b0; --card:#1b1e24; --line:#2f343d;
      --accent:#6f97ff; --accent-bg:#1d2a4a; --accent-fg:#0b1020; --warn:#ffcf70; --warn-bg:#3a2e12;
      --bad:#ff7b72; --focus:#8fb0ff;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 32px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .lede { color:var(--mut); margin:0 0 20px; font-size:15px; }
  fieldset { border:0; padding:0; margin:0 0 20px; min-width:0; }
  legend { font-weight:600; font-size:17px; padding:0; margin-bottom:8px; }
  .options { display:grid; gap:8px; }
  .opt { position:relative; display:block; }
  /* Real radio inputs: visually hidden but focusable, so arrow keys and screen readers work natively. */
  .opt input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .opt .box {
    display:flex; align-items:center; gap:12px; min-height:56px; padding:10px 14px;
    background:var(--card); border:2px solid var(--line); border-radius:12px; cursor:pointer;
  }
  .opt .dot { flex:none; width:20px; height:20px; border:2px solid var(--mut); border-radius:50%; }
  .opt .t { display:block; font-weight:600; }
  .opt .d { display:block; color:var(--mut); font-size:14px; }
  .opt input:checked + .box { border-color:var(--accent); background:var(--accent-bg); }
  .opt input:checked + .box .dot { border-color:var(--accent); background:radial-gradient(circle, var(--accent) 45%, transparent 50%); }
  .opt input:focus-visible + .box { outline:3px solid var(--focus); outline-offset:2px; }
  .opt .box:hover { border-color:var(--accent); }
  .summary { font-size:14px; color:var(--mut); margin:0 0 10px; min-height:1.45em; }
  button#start {
    width:100%; min-height:52px; border:0; border-radius:12px; font:inherit; font-size:17px; font-weight:600;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
  }
  button#start:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
  button#start:disabled { background:var(--line); color:var(--mut); cursor:not-allowed; }
  #status { margin-top:16px; }
  .notice { border-radius:12px; padding:12px 14px; font-size:15px; }
  .notice.warn { background:var(--warn-bg); color:var(--warn); }
  .notice.ok { background:var(--accent-bg); color:var(--fg); }
  .notice.bad { background:var(--warn-bg); color:var(--bad); }
  pre { margin:8px 0 0; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:8px;
        color:var(--fg); font:13px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  .foot { color:var(--mut); font-size:13px; margin-top:24px; }
  @media (min-width:720px) { main { padding-top:48px; } }
</style>
</head>
<body>
<main>
  <h1>Brodia</h1>
  <p class="lede">Practice starting a conversation on a call. She is a fictional adult with her own boundaries. Afterwards you get coaching.</p>

  <form id="picker" novalidate>
    <fieldset>
      <legend>Where you meet her</legend>
      <div class="options">
        <label class="opt"><input type="radio" name="scenario" value="barista">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Barista at work</span><span class="d">She's on shift. Keep it brief and mind the line.</span></span></span></label>
        <label class="opt"><input type="radio" name="scenario" value="street">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Woman on the street</span><span class="d">A stranger passing by. She may be in a hurry.</span></span></span></label>
        <label class="opt"><input type="radio" name="scenario" value="park">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Woman in the park</span><span class="d">Relaxed setting with more room for small talk.</span></span></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>How open she is</legend>
      <div class="options">
        <label class="opt"><input type="radio" name="receptivity" value="interested">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Interested</span><span class="d">She'll reciprocate, but nothing is guaranteed.</span></span></span></label>
        <label class="opt"><input type="radio" name="receptivity" value="neutral">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Neutral</span><span class="d">Polite and brief. Interest isn't assumed.</span></span></span></label>
        <label class="opt"><input type="radio" name="receptivity" value="uninterested">
          <span class="box"><span class="dot" aria-hidden="true"></span><span>
            <span class="t">Uninterested</span><span class="d">May politely leave. A graceful exit is a win.</span></span></span></label>
      </div>
    </fieldset>

    <p class="summary" id="summary" aria-live="polite"></p>
    <button id="start" type="submit" disabled>Start Practice</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <p class="foot">Nothing is saved. You can end the call at any time.</p>
</main>

<script>
// BEGIN selection-core (pure; scripts/test_selector.py runs this block in Node)
const SCENARIOS = ['barista', 'street', 'park'];
const RECEPTIVITIES = ['interested', 'neutral', 'uninterested'];

// Returns {ok:true, selection} with exactly the contract keys, or {ok:false, error}.
function validateSelection(input) {
  if (!input || typeof input !== 'object') return { ok: false, error: 'Selection missing' };
  const { scenario, receptivity } = input;
  if (!SCENARIOS.includes(scenario)) return { ok: false, error: 'Pick a scenario' };
  if (!RECEPTIVITIES.includes(receptivity)) return { ok: false, error: 'Pick how open she is' };
  return { ok: true, selection: { scenario, receptivity } };
}
// END selection-core

// The single start hook. Returns {connected:boolean, message:string}.
// TODO(P06/P07): send `selection` to the per-session config handoff (P06) and open the real
// LiveKit practice call with it (P07). Until then this must report "not connected", never fake success.
async function startPractice(selection) {
  return { connected: false, message: "Not connected yet. Calls aren't wired up (P06/P07)." };
}

const form = document.getElementById('picker');
const startBtn = document.getElementById('start');
const summary = document.getElementById('summary');
const statusEl = document.getElementById('status');

function current() {
  const fd = new FormData(form);
  return { scenario: fd.get('scenario'), receptivity: fd.get('receptivity') };
}

function labelFor(name, value) {
  const el = form.querySelector(`input[name="${name}"][value="${value}"]`);
  return el ? el.closest('.opt').querySelector('.t').textContent : '';
}

function refresh() {
  const sel = current();
  const v = validateSelection(sel);
  startBtn.disabled = !v.ok;
  if (v.ok) summary.textContent = `${labelFor('scenario', sel.scenario)} · ${labelFor('receptivity', sel.receptivity)}`;
  else if (!sel.scenario && !sel.receptivity) summary.textContent = 'Pick one of each to start.';
  else summary.textContent = v.error + ' to start.';
}

function notice(kind, text, json) {
  statusEl.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'notice ' + kind;
  box.textContent = text;
  if (json) {
    const pre = document.createElement('pre');
    pre.textContent = json;
    box.appendChild(pre);
  }
  statusEl.appendChild(box);
}

// Optional preselection: ?scenario=park&receptivity=neutral (invalid values are ignored).
const q = new URLSearchParams(location.search);
for (const [name, list] of [['scenario', SCENARIOS], ['receptivity', RECEPTIVITIES]]) {
  const val = q.get(name);
  if (list.includes(val)) form.querySelector(`input[name="${name}"][value="${val}"]`).checked = true;
}

form.addEventListener('change', () => { statusEl.innerHTML = ''; refresh(); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = validateSelection(current());
  if (!v.ok) { notice('bad', v.error); refresh(); return; }
  const json = JSON.stringify(v.selection);
  startBtn.disabled = true;
  try {
    const res = await startPractice(v.selection);
    notice(res.connected ? 'ok' : 'warn', res.message, json);
  } catch (err) {
    notice('bad', 'Could not start: ' + (err && err.message ? err.message : err), json);
  } finally {
    refresh();
  }
});
refresh();
</script>
</body>
</html>
