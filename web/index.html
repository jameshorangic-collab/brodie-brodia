<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Brodia Practice</title>
<style>body{font:18px system-ui;max-width:600px;margin:3rem auto;padding:1rem}fieldset{margin:1rem 0}button{padding:.7rem 1rem;font-size:1rem}#status{white-space:pre-wrap}video{max-width:100%;margin-top:1rem;border-radius:.5rem}</style>
<h1>Brodia practice</h1><p>Choose a fictional adult scenario. “Uninterested” means practice a respectful exit.</p>
<fieldset><legend>Scenario</legend><label><input name=s value=barista type=radio> Barista</label><label><input name=s value=street type=radio> Street</label><label><input name=s value=park type=radio> Park</label></fieldset>
<fieldset><legend>Receptivity</legend><label><input name=r value=interested type=radio> Interested</label><label><input name=r value=neutral type=radio> Neutral</label><label><input name=r value=uninterested type=radio> Uninterested</label></fieldset>
<button disabled id=start>Start practice</button> <button hidden id=leave>End call</button><p id=status></p><div id=media></div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
<script>
const pick=n=>document.querySelector(`input[name=${n}]:checked`)?.value,start=document.querySelector('#start'),leave=document.querySelector('#leave'),status=document.querySelector('#status'),media=document.querySelector('#media');let room;
document.onchange=()=>start.disabled=!(pick('s')&&pick('r'));
function add(track,local=false){const element=track.attach();if(local)element.muted=true;media.append(element)}
async function end(){const active=room;room=undefined;if(active)await active.disconnect();media.replaceChildren();leave.hidden=true;start.disabled=!(pick('s')&&pick('r'));status.textContent='Call ended.'}
leave.onclick=end;
start.onclick=async()=>{start.disabled=true;status.textContent='Creating your private practice room…';try{let r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:pick('s'),receptivity:pick('r')})});if(!r.ok)throw Error('Could not start practice');let x=await r.json();room=new LivekitClient.Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>add(track));room.on(LivekitClient.RoomEvent.Disconnected,()=>end());await room.connect(x.url,x.token);await room.startAudio();await room.localParticipant.enableCameraAndMicrophone();for(const pub of room.localParticipant.trackPublications.values())if(pub.track){add(pub.track,true);if(pub.track.kind==='audio'){const s=pub.track.mediaStreamTrack.getSettings();console.info('Brodia microphone settings',{sampleRate:s.sampleRate,channelCount:s.channelCount,echoCancellation:s.echoCancellation,noiseSuppression:s.noiseSuppression,autoGainControl:s.autoGainControl})}}leave.hidden=false;status.textContent=`Connected to ${x.scenario} + ${x.receptivity}. You can end the call any time.`}catch(e){const message=e.message;await end();status.textContent=message}};
</script>
