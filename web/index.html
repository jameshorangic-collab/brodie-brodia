<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brodia Practice</title>
<style>body{font:18px system-ui;max-width:600px;margin:3rem auto;padding:1rem}fieldset{margin:1rem 0}button{padding:.7rem 1rem;font-size:1rem}#status{white-space:pre-wrap}</style>
<h1>Brodia practice</h1><p>Choose a fictional adult scenario. “Uninterested” means practice a respectful exit.</p>
<fieldset><legend>Scenario</legend><label><input name=s value=barista type=radio> Barista</label><label><input name=s value=street type=radio> Street</label><label><input name=s value=park type=radio> Park</label></fieldset>
<fieldset><legend>Receptivity</legend><label><input name=r value=interested type=radio> Interested</label><label><input name=r value=neutral type=radio> Neutral</label><label><input name=r value=uninterested type=radio> Uninterested</label></fieldset>
<button disabled id=start>Start practice</button><p id=status></p>
<script>const pick=n=>document.querySelector(`input[name=${n}]:checked`)?.value;const b=start;document.onchange=()=>b.disabled=!(pick('s')&&pick('r'));b.onclick=async()=>{b.disabled=true;status.textContent='Starting secure practice room…';try{let r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:pick('s'),receptivity:pick('r')})});if(!r.ok)throw Error('Could not start');let x=await r.json();status.textContent=`Room ready: ${x.room}\nOpen the tokenized phone link from your trusted local test flow.`;console.log('LiveKit session',x)}catch(e){status.textContent=e.message;b.disabled=false}};</script>
